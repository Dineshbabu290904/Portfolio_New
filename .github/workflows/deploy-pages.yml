name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      # A <user>.github.io repository is served from the domain root; any other repository is
      # served from /<repo>/. Pick the base path to match.
      - name: Work out the site's base path
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "${repo,,}" == "${{ github.repository_owner }}.github.io" || "${repo,,}" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${repo}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build for GitHub Pages
        run: npm run build
        env:
          VITE_BASE: ${{ steps.base.outputs.path }}

      # GitHub Pages has no SPA rewrites: serve the app for unknown paths so deep links work.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
